name: Security regression tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  security-tests:
    name: Security tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install pytest PyYAML requests rich emoji pyfiglet
      - name: Run synthetic security regressions
        run: python -m pytest tests/test_security.py -q
